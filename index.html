<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>canvas-peli</title>
    <link rel="stylesheet" href="style.css">



    <script defer src="bird.js"></script>
    <script defer src="putket.js"></script>
    <script defer src="main.js"></script>

</head>
<body>
    <h2>flappy bird</h2>
    <div class="game-shell">

    </div>
