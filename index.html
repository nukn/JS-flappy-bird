<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>canvas-peli</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

</head>
<body>
    <h2>flappy bird</h2>
    <div class="game-shell">
        <canvas id="peliCanvas" width="480" height="640"></canvas>
        <div class="game-ui">
            <button id="playBtn" class="ui-btn">Play</button>
            <button id="restartBtn" class="ui-btn" hidden>Restart</button>
            <div id="gameOverText" class="game-over" hidden>Game Over</div>
            <div id="highScoreText">High score: 0</div>
            <div id="scoreText">0</div>
            
        </div>
    </div>
    

    <script src="bird.js"></script>
    <script src="putket.js"></script>
    <script src="main.js"></script>
    
</body>
</html>
